{% extends "base.html" %}
{% block title %}Sign in · Call Log{% endblock %}
{% block body_class %}centered{% endblock %}
{% block body %}
<main class="auth-card card">
  <div class="auth-brand">
    <img class="logo logo-lg" src="{{ url_for('static', filename='nbe-logo.svg') }}" alt="NBE" width="72" height="72">
    <div>
      <h1>Incoming Calls Registration Log</h1>
      <p class="muted">Sign in with your User ID</p>
    </div>
  </div>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('pages.login') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">User ID
      <input name="user_id" value="{{ user_id }}" autocomplete="username" autocapitalize="off"
             spellcheck="false" required {% if not user_id %}autofocus{% endif %}>
    </label>
    <label class="field">Password
      <input name="password" type="password" autocomplete="current-password" required
             {% if user_id %}autofocus{% endif %}>
    </label>
    <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
  </form>
</main>
{% endblock %}
