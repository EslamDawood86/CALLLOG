{% extends "base.html" %}
{% block title %}{{ title }} · Call Log{% endblock %}
{% block body_class %}centered{% endblock %}
{% block body %}
<div class="theme-corner">{% include "_theme_toggle.html" %}</div>
<main class="auth-card card">
  <img class="logo logo-lg" src="{{ url_for('static', filename='nbe-logo.svg') }}" alt="NBE" width="72" height="72">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p><a class="btn btn-primary" href="{{ url_for('pages.index') }}">Back to the log</a></p>
</main>
{% endblock %}
